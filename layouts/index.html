<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>xfnty's blog</title>
</head>
<body>
    <header>
        <p>
            Welcome &#128075;
        </p>
        <p>
            Here I write about things that interest me, like games and programming. <br>
            Mostly to put my thoughts in order.
        </p>
    </header>

    <main>
        {{ range .Site.RegularPages }}
            <a href="{{ .RelPermalink }}" class="article-link">
                <div>
                    <h1>{{ .Title }}</h2>
                    <p>{{ .Description }}</p>
                </div>
                <time>{{ .Date.Format "Jan 2, 2006" }}</time>
            </a>
        {{ end }}
    </main>

    <footer>
        &copy; <a href="https://github.com/xfnty" target="_blank">xfnty</a> 2025
    </footer>
</body>
</html>
